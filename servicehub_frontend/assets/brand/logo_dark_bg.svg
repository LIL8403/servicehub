    <circle cx="60" cy="60" fill="#B86B3E" r="7"/>
  </g>
  <text x="140" y="62"
        font-family="Plus Jakarta Sans, -apple-system, sans-serif"
        font-size="42" font-weight="700" fill="#FFFFFF"
        letter-spacing="-1">Service</text>
  <text x="290" y="62"
        font-family="Plus Jakarta Sans, -apple-system, sans-serif"
        font-size="42" font-weight="800" fill="#B86B3E"
