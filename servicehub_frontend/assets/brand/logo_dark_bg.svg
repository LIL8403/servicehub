  <text x="141" y="90"
        font-family="Plus Jakarta Sans, -apple-system, sans-serif"
        font-size="12" font-weight="600" fill="#D48B5C"
        letter-spacing="3.2">VERIFIED SERVICE MARKETPLACE</text>
</svg>